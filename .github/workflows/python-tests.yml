
name: Flask Security Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python application tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.2.0

      - name: Run automated tests
        run: python -m pytest -v


  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt



  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Alpine application image
        run: |
          docker build \
            --file Dockerfile.alpine \
            --tag flask-security:ci \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: flask-security:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '0'

      - name: Upload vulnerability scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerability-report
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30
